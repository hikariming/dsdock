name: desktop

# Builds DSDock.app on macOS, runs it against a real DSH, and screenshots the
# main window and the menu bar panel. The app and the screenshots are kept
# as artifacts: there is no Mac in development, so this is how the native
# interface gets looked at.
on:
  push:
    branches: [main]
    paths: ["internal/**", "main.go", "go.mod", "go.sum", ".github/workflows/desktop.yml"]
  workflow_dispatch:

jobs:
  macos-app:
    runs-on: macos-latest
    env:
      DSDOCK_HOME: ${{ github.workspace }}/.ci/dsdock
      DSH_HOME: ${{ github.workspace }}/.ci/dsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm

      - name: Build DSDock.app
        run: |
          set -euo pipefail
          .github/release/build-app.sh "desktop-${GITHUB_SHA::7}" dist
          ditto -c -k --keepParent dist/DSDock.app dist/DSDock-macos-preview.zip

      - name: Prepare a DSH with two profiles
        run: |
          set -euo pipefail
          BIN=dist/DSDock.app/Contents/MacOS/dsdock-app
          $BIN dsh install latest
          export DSDOCK_DSH_VERSION=$($BIN dsh list --json | python3 -c 'import json,sys;print(json.load(sys.stdin)["default"])')
          DSH="node $DSDOCK_HOME/versions/$DSDOCK_DSH_VERSION/node_modules/@deepseek-ai/dsh/lib/bin.js"
          F=internal/cli/testdata/bundles
          $DSH plugin --profile web add "$PWD/$F/fx-ok"
          for b in fx-ok fx-conflict-a fx-conflict-b; do $DSH plugin --profile work add "$PWD/$F/$b"; done
          $BIN status

      # Reproduces preview.2's bug: opened from Finder, an app gets launchd's
      # bare PATH and could not see a dsh installed with npm -g. Here dsh is
      # on the PATH only through ~/.zprofile, and the app starts with an
      # empty environment and no DSH of DSDock's own.
      - name: Finder-like launch finds the user's dsh
        run: |
          set -euo pipefail
          npm install -g @deepseek-ai/dsh@latest --no-audit --no-fund > /dev/null
          NPMBIN=$(dirname "$(command -v dsh)")
          echo "export PATH=\"$NPMBIN:\$PATH\"" >> ~/.zprofile
          mkdir -p shots
          BIN=$PWD/dist/DSDock.app/Contents/MacOS/dsdock-app
          env -i HOME="$HOME" USER="$USER" LOGNAME="$USER" SHELL=/bin/zsh TMPDIR="$TMPDIR" \
            PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            DSDOCK_HOME="$RUNNER_TEMP/finder-dsdock" DSH_HOME="$DSH_HOME" \
            "$BIN" app --show main > shots/finder.log 2>&1 &
          pid=$!
          sleep 14
          screencapture -x shots/finder.png || true
          kill "$pid" || true
          sleep 2

      - name: Screenshots
        run: |
          set -euo pipefail
          mkdir -p shots
          BIN=dist/DSDock.app/Contents/MacOS/dsdock-app
          shoot() {
            "$BIN" app --show "$1" > "shots/$1.log" 2>&1 &
            pid=$!
            sleep 12
            screencapture -x "shots/$1.png" || echo "screencapture failed"
            kill "$pid" || true
            sleep 2
            pkill -f '[d]sdock-app' || true
          }
          shoot main
          shoot panel
          ls -la shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-screenshots
          path: shots/
      - uses: actions/upload-artifact@v4
        with:
          name: DSDock-macos-preview
          path: dist/DSDock-macos-preview.zip
